# ClickHouse + a read-only ClickHouse tool server (MCP) for an AI agent.
# Start with ./setup.sh, then: docker compose up -d --build
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    mem_limit: 1536m   # this table is tiny; keeps Docker from growing
    environment:
      CLICKHOUSE_DB: spotify
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../data:/seed:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT count() FROM spotify.songs' | grep -qv '^0$'"]
      interval: 5s
      timeout: 5s
      retries: 20
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  mcp-clickhouse:
    build: ./mcp
    mem_limit: 256m
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: agent_ro
      CLICKHOUSE_PASSWORD: ${AGENT_RO_PASSWORD}
      CLICKHOUSE_DATABASE: spotify
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_ALLOWED_HOSTS: "mcp-clickhouse:8000,localhost:*,127.0.0.1:*"
      CLICKHOUSE_MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      CLICKHOUSE_MCP_QUERY_TIMEOUT: "20"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  clickhouse-data:
