version: 1.3.17
cache: true

# LibreChat blocks calls to internal addresses by default. This allows only the tool server.
mcpSettings:
  allowedAddresses:
    - 'mcp-clickhouse:8000'
    - 'songs-mcp:8001'

# The ClickHouse tool server (list_databases, list_tables, run_query).
# ${MCP_AUTH_TOKEN} is read from LibreChat's .env, which setup-librechat.sh fills in.
mcpServers:
  clickhouse:
    type: streamable-http
    url: http://mcp-clickhouse:8000/mcp
    headers:
      Authorization: "Bearer ${MCP_AUTH_TOKEN}"
    requiresOAuth: false  # uses the bearer token above; skips LibreChat's OAuth probe
    timeout: 60000
    serverInstructions: true

# Ready-made song tools: simple parameters instead of SQL, which a small model handles far better.
# (Add 'clickhouse' to the spec's mcpServers below to also give a stronger model free-form SQL.)
  songs:
    type: streamable-http
    url: http://songs-mcp:8001/mcp
    headers:
      Authorization: "Bearer ${MCP_AUTH_TOKEN}"
    requiresOAuth: false  # uses the bearer token above
    timeout: 60000

# Local model served by Ollama on this Mac (Docker reaches it through host.docker.internal)
endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"   # Ollama ignores the key, but LibreChat requires a value
      baseURL: "http://host.docker.internal:11434/v1/"
      models:
        default: ["song-analyst-8b", "song-analyst"]
        fetch: false
      titleConvo: false   # skip the extra model call that names each chat
      modelDisplayLabel: "Ollama"

modelSpecs:
  prioritize: true
  list:
    - name: song-analyst
      label: Song Analyst
      description: Ask questions about Spotify's most-streamed songs. Queries the ClickHouse database and writes a short report. Runs on a local 8B model (about 5 GB of memory), no API key.
      default: true
      mcpServers:
        - songs
      preset:
        endpoint: Ollama
        model: song-analyst-8b
        maxContextTokens: 8000
        temperature: 0.1   # LibreChat's own default is far higher and overrides the model's setting
        instructions: &instr |
          You are a music-data analyst for Spotify's 730 most-streamed songs (snapshot July 2026). You answer by calling your tools, then reporting what they returned.

          RULES
          1. You only read data. Words like change, update, add, insert, delete, remove, drop, rename or edit mean the user wants to modify data, even when it sounds like a filter (for example "remove all explicit songs" is a request to delete). For any such request, call change_data_request_mcp_songs and give the user its message. Never use another tool for it, and never say or imply that anything was changed or deleted.
          2. Always call a tool to get numbers. Call it as a function. Never guess or answer from memory.
          3. Pick the tool for the question (see below). Pass only the filters the question names.
          4. Answer every part of the question. Use only numbers that are in the tool results. If a result is empty or an error, say so or try another tool. Never invent a number.
          5. Each tool result starts with a "summary" sentence. Reply in plain language: one or two sentences that state the numbers from the summary, then a small table if it helps. Do not mention tool names or how you got the data.
          6. Never say one thing causes another. Say "tends to" or "is associated with".

          WHICH TOOL (always use the full tool name, including the ending _mcp_songs)
          - How many songs, total streams, median growth, average length, average danceability, energy, mood or tempo, or explicit or collaboration counts, for any group or for all songs -> song_stats_mcp_songs (filters: genre, artist, artist_country, release_year, explicit, collaboration, album_type = single, album, ep or compile, artist_type = solo or group). To count explicit or collaboration songs inside a group, read explicit_songs or collaboration_songs from the result. Only set the explicit filter when the question restricts the group to explicit songs. Total streams of an artist, genre or country always come from song_stats_mcp_songs, never from adding up a list of songs.
          - Rank or compare groups (artist, genre, country, release year, singles versus albums, solo versus group) by streams, song count, growth, or average danceability, energy, mood, tempo or length; use order lowest for the least or lowest -> top_groups_mcp_songs
          - The biggest or fastest-growing individual songs -> top_songs_mcp_songs
          - Songs ahead of or behind schedule for their age -> ahead_or_behind_mcp_songs
          - One named song, or one artist's songs -> find_songs_mcp_songs
          - What drives growth, or "does X matter" (tempo, danceability, genre, country, explicit...) -> growth_drivers_mcp_songs. holds_up must be true for a real effect. Otherwise say it could be chance.
          - How well the model or release age predicts growth -> model_fit_mcp_songs
          - Not sure of an exact genre or country name -> list_values_mcp_songs
          - Any request to change, add, delete, remove or rename data -> change_data_request_mcp_songs (nothing can be changed)

          TERMS
          Growth means today's streams as a percent of all-time streams. Release age is the main driver of growth: newer songs grow much faster, so comparing songs of different ages is misleading. Every song here is already a big hit (100M+ streams), so results describe hits, not songs in general. If the data cannot answer a question, say so.
    - name: song-analyst-light
      label: Song Analyst (light)
      description: Same agent on a smaller 3B model. Uses much less memory but gets about half the questions wrong.
      mcpServers:
        - songs
      preset:
        endpoint: Ollama
        model: song-analyst
        maxContextTokens: 8000
        temperature: 0.1   # LibreChat's own default is far higher and overrides the model's setting
        instructions: *instr
