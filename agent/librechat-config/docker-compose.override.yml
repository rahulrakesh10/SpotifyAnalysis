# Applied on top of LibreChat's own docker-compose.yml.
services:
  api:
    # Only reachable from this computer
    ports: !override
      - "127.0.0.1:3080:3080"
    # Skip LibreChat's document-search service; the agent only needs the database
    depends_on: !override
      - mongodb
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
    mem_limit: 1g
    # Join the network where ClickHouse and the tool server run
    networks:
      - default
      - songs

  # MongoDB otherwise claims about half the memory it can see for its cache
  mongodb:
    command: mongod --noauth --wiredTigerCacheSizeGB 0.25
    mem_limit: 512m
  meilisearch:
    mem_limit: 512m
    environment:
      - MEILI_MAX_INDEXING_MEMORY=256Mb

networks:
  songs:
    name: agent_default
    external: true
